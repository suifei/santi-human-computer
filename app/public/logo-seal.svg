<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
    <filter id="inner" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <!-- 印泥方章 -->
  <g filter="url(#rough)">
    <rect x="10" y="10" width="108" height="108" rx="14" fill="#A32E22"/>
    <rect x="18" y="18" width="92" height="92" rx="9" fill="none" stroke="#E8DCC3" stroke-opacity="0.85" stroke-width="3"/>
  </g>
  <!-- 篆意「人列」二字（白文） -->
  <g filter="url(#rough)" fill="none" stroke="#F3E9D2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 人 -->
    <path d="M46 34 C 40 48 33 58 26 64"/>
    <path d="M46 34 C 52 48 59 58 66 64"/>
    <!-- 列 -->
    <path d="M82 32 L82 46 M74 40 L90 40"/>
    <path d="M76 46 C 74 54 71 60 67 64 M88 46 C 90 54 93 60 97 64"/>
    <path d="M104 30 L104 64 M110 28 L110 66"/>
  </g>
  <!-- 下排小字纹样（橫劃示意「計算」） -->
  <g filter="url(#rough)" stroke="#F3E9D2" stroke-width="5.5" stroke-linecap="round" opacity="0.9">
    <path d="M34 80 L94 80"/>
    <path d="M40 92 L88 92"/>
    <path d="M64 72 L64 100"/>
    <path d="M48 72 L48 86 M80 72 L80 86" stroke-width="4.5"/>
  </g>
  <!-- 印泥高光 -->
  <rect x="10" y="10" width="108" height="108" rx="14" fill="none" stroke="#5F1A11" stroke-opacity="0.5" stroke-width="2" filter="url(#inner)"/>
</svg>
